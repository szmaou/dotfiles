# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# app
bind=SUPER,b,spawn,helium-browser
bind=SUPER,e,spawn,thunar
bind=CTRL+SHIFT,Escape,spawn,foot -e htop
bind=SUPER,Return,spawn,foot
bind=CTRL+SUPER,a,spawn,wmenu-run

# noctalia
bind=SUPER,a,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER,n,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle noctalia/wallhaven:browser
bind=SUPER,F1,spawn,noctalia msg panel-toggle control-center media
bind=SUPER,comma,spawn,noctalia msg settings-toggle
#bind=SUPER,slash,spawn,noctalia msg panel-toggle blackbartblues/keymap:panel
bind=none,MENU,spawn,noctalia msg bar-toggle
bind=none,Print,spawn,noctalia msg screenshot-fullscreen
bind=CTRL,Print,spawn,noctalia msg screenshot-region
bind=CTRL+ALT,Delete,spawn,noctalia msg panel-toggle session 

# reload config
bind=SUPER,r,reload_config

# exit
bind=SUPER,Delete,quit
bind=SUPER,q,killclient
bind=ALT,q,killclient

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=ALT+SHIFT,Up,exchange_client,up
bind=ALT+SHIFT,Down,exchange_client,down
bind=ALT+SHIFT,Left,exchange_client,left
bind=ALT+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT,m,minimized,
bind=ALT+SHIFT,m,restore_minimized
bind=SUPER,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,space,switch_layout

# tag switch
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

# monitor switch
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT,g,togglegaps

# movewin
bind=CTRL+SHIFT,Up,smartmovewin,up
bind=CTRL+SHIFT,Down,smartmovewin,down
bind=CTRL+SHIFT,Left,smartmovewin,left
bind=CTRL+SHIFT,Right,smartmovewin,right

# resizewin
bind=CTRL+ALT,Up,smartresizewin,up
bind=CTRL+ALT,Down,smartresizewin,down
bind=CTRL+ALT,Left,smartresizewin,left
bind=CTRL+ALT,Right,smartresizewin,right

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Media keys — via noctalia (works when locked)
bindl=none,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=none,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=none,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=none,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=none,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bindl=none,XF86AudioPlay,spawn,noctalia msg media playPause
bindl=none,XF86AudioNext,spawn,noctalia msg media next
bindl=none,XF86AudioPrev,spawn,noctalia msg media previous

# Media keys — custom (SUPER + function keys, works when locked)
bindl=SUPER,F2,spawn,noctalia msg volume-down
bindl=SUPER,F3,spawn,noctalia msg volume-up
bindl=SUPER,F4,spawn,noctalia msg volume-mute
bindl=SUPER,F5,spawn,noctalia msg media stop
bindl=SUPER,F6,spawn,noctalia msg media previous
bindl=SUPER,F7,spawn,noctalia msg media toggle
bindl=SUPER,F8,spawn,noctalia msg media next
bindl=SUPER,Page_Up,spawn,noctalia msg brightness-up
bindl=SUPER,Page_Down,spawn,noctalia msg brightness-down
