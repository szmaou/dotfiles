# ─────────────────────────────── Layout ─────────────────────────────────────
# Configure the default tiling mode and shared sizing behavior. Workspace rules
# above can override these values for individual workspaces.
# Documentation: https://docs.noctalia.dev/umbriel/layout/
# ────────────────────────────────────────────────────────────────────────────

[layout]
mode = "scrolling"                        # scrolling, dwindle, or master
gap = 4                                   # Logical pixels between tiles, 0-500
extent_presets = [0.333, 0.5, 0.667, 1.0] # Width and height cycling fractions
# new_exits_fullscreen = [] # "tiled", "floating", "pinned", "all", or an array such as ["tiled", "floating"]
client_maximize = "column" # or "edges"

[layout.struts]
# Signed logical pixels reserved after panel exclusive zones. Negative values
# expand the tiled area beyond that edge.
left = 0   # -65535 to 65535
right = 0
top = 0
bottom = 0

[layout.scrolling]
# direction = "horizontal"                      # horizontal or vertical strip axis
default_extent_fraction = 0.5     # Initial width for new columns, 0.1-1.0
center_underfull_strip = true     # Center a strip narrower than the viewport
center_focused = "on_overflow"    # Always center the focused column
center_on_overview_select = false

[layout.dwindle]
# preserve_split = false                        # Keep every split direction fixed after creation
new_toward_cursor = false

[layout.master]
position = "left"             # left or right master area
default_width_fraction = 0.55 # Initial master area fraction, 0.1-0.9
new_on_top = true             # Put new windows at the top of the stack
new_becomes_master = false

[layout.tabs]
default_display = "normal"
new_tab_position = "end"
wrap_focus = true
scroll_switches_tabs = true
middle_click_closes = false
